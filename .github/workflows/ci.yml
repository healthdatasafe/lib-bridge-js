name: Lib Bridge JS CI
# The HDS_CI_TOKEN guard this workflow used to carry is gone: healthdatasafe/dev-boiler
# and healthdatasafe/dev-newrelic-scrub were made public on 2026-09-17, so every
# dependency in this repo's tree resolves without credentials. Verified locally by
# running the gates below against a clean install.

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    # The integration tests SKIP unless a real Pryv account is provisioned
    # (`bridgeIsConfigured()` in tests/helpers/testServer.ts). CI has no
    # localConfig.yml (gitignored), so only config/test-config.yml applies: the unit
    # tests run and the integration ones report as pending. The test script no longer
    # passes `--config localConfig.yml`, which mocha read as its own rc file and aborted
    # on when the file was absent, so no placeholder file needs seeding.
    - name: Test
      run: npm test
