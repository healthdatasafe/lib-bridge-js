name: Lib Bridge JS CI
# The HDS_CI_TOKEN guard this workflow used to carry is gone: healthdatasafe/dev-boiler
# and healthdatasafe/dev-newrelic-scrub were made public on 2026-09-17, so every
# dependency in this repo's tree resolves without credentials. Verified locally by
# running the gates below against a clean install.

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    # The integration tests SKIP unless a real Pryv account is provisioned
    # (`bridgeIsConfigured()` in tests/helpers/testServer.ts). The sample config
    # carries `bridgeApiEndPoint: OVERRIDE_ME`, which is exactly the unconfigured
    # state, so the unit tests run and the integration ones report as pending.
    # mocha needs the file to exist at all in order to start.
    - name: Seed an unconfigured localConfig for the test run
      run: cp config/sample-localConfig.yml localConfig.yml

    - name: Test
      run: npm test
