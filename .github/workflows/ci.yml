name: Lib Bridge JS CI

# `@pryv/boiler` resolves to healthdatasafe/dev-boiler, which is PRIVATE, so
# `npm install` needs credentials the default GITHUB_TOKEN does not carry.
# Until an `HDS_CI_TOKEN` repo secret exists (a PAT or fine-grained token with
# read access to the private dependency repos), the build steps are skipped
# rather than failing red — a red badge on a shared library blocks consumers.
#
# The `secrets` context is not available in a job-level `if`, so the presence
# check runs as a step and later steps gate on its output.

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - name: Detect credentials for private dependencies
      id: guard
      env:
        TOKEN: ${{ secrets.HDS_CI_TOKEN }}
      run: |
        if [ -n "$TOKEN" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::notice::HDS_CI_TOKEN is not set; skipping build. Add the secret to enable CI."
        fi

    - name: Checkout repository
      if: steps.guard.outputs.ok == 'true'
      uses: actions/checkout@v4

    - name: Install Node.js ${{ matrix.node-version }}
      if: steps.guard.outputs.ok == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Authenticate to private dependency repos
      if: steps.guard.outputs.ok == 'true'
      env:
        TOKEN: ${{ secrets.HDS_CI_TOKEN }}
      run: git config --global url."https://$TOKEN@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      if: steps.guard.outputs.ok == 'true'
      run: npm install

    - name: Build
      if: steps.guard.outputs.ok == 'true'
      run: npm run build

    - name: Lint
      if: steps.guard.outputs.ok == 'true'
      run: npm run lint

    # The integration tests are designed to SKIP unless a real Pryv account is
    # provisioned (`bridgeIsConfigured()` in tests/helpers/testServer.ts). The
    # sample config carries `bridgeApiEndPoint: OVERRIDE_ME`, which is exactly
    # the unconfigured state, so the unit tests gate and the integration ones
    # report as pending. mocha needs the file to exist at all in order to start.
    - name: Seed an unconfigured localConfig for the test run
      if: steps.guard.outputs.ok == 'true'
      run: cp config/sample-localConfig.yml localConfig.yml

    - name: Test
      if: steps.guard.outputs.ok == 'true'
      run: npm test
