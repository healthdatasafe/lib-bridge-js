# lib-bridge-js framework defaults
# Consumer apps should provide their own default-config.yml with partner-specific values.

# Server
server:
  port: 7432
  host: '0.0.0.0'
  # Origins allowed to call this bridge from a browser (CORS): exact https origins, e.g.
  # ["https://app.hds.ngo", "https://account.hds.ngo", "https://doctor-dashboard.hds.ngo"].
  # Set per environment with `server__corsOrigins` (a JSON array). "*" opens it explicitly.
  # Unset (null) keeps every origin open and logs a warning at boot.
  # Note: a bridge's own config/default-config.yml replaces this file, it is not merged.
  corsOrigins: null

# Clustering
start:
  # if numProcesses=0 launch 1 process per CPU
  # if numProcesses>0 launch exactly numProcess processes
  # if numProcesses<0 launch max(numCPU + numProcess, 1) process(es)
  numProcesses: 0
  # When a worker crash-loop persists (default: 5 crashes/30s, unbroken for 5 min),
  # exit the master with code 1 so the orchestrator (Dokku) marks the app down.
  # Default false: the master keeps self-healing (bounded backoff + noticeError).
  # Opt in per bridge (e.g. bridge-mira) for hard-fail monitoring.
  exitOnCrashLoop: false

# Logging
logs:
  console:
    active: true
    level: info
    format:
      color: true
      time: true
      aligned: true
  file:
    active: true
    path: application.log

# Storage
storage:
  files:
    directory: ./storage

# CMC relationship module (createCmcRelationships, plan 129). The same values are the code
# defaults (a bridge's own default-config.yml replaces this file); options passed to
# createCmcRelationships override them. Also reads service:apiEndpointHostPattern (null rejects
# every accept), service:patientAppBaseUrl and service:serviceInfoURL.
cmc:
  # true creates the {main}-cmc stream (inbox cursor) and is required by start()
  enabled: false
  appCode: hds-bridge-reader
  invite:
    expiresInSeconds: 604800
    features: { chat: false, systemMessaging: true }
  inbox:
    intervalS: 30
    lagS: 120
    # Pryv seconds: where a first run starts reading the inbox (set by a migration)
    initialCursor: null
  scope:
    pollIntervalS: 60
  reconcile:
    intervalS: 900
  leaseTtlMs: 60000
  webhooks:
    # needs a public publicBaseUrl: the core refuses private hosts (local dev runs poll-only)
    enabled: false
    publicBaseUrl: null
