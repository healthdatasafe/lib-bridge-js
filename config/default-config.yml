# lib-bridge-js framework defaults
# Consumer apps should provide their own default-config.yml with partner-specific values.

# Server
server:
  port: 7432
  host: '0.0.0.0'
  # Origins allowed to call this bridge from a browser (CORS): exact https origins, e.g.
  # ["https://app.hds.ngo", "https://account.hds.ngo", "https://doctor-dashboard.hds.ngo"].
  # Set per environment with `server__corsOrigins` (a JSON array). "*" opens it explicitly.
  # Unset (null) keeps every origin open and logs a warning at boot.
  # Note: a bridge's own config/default-config.yml replaces this file, it is not merged.
  corsOrigins: null

# Clustering
start:
  # if numProcesses=0 launch 1 process per CPU
  # if numProcesses>0 launch exactly numProcess processes
  # if numProcesses<0 launch max(numCPU + numProcess, 1) process(es)
  numProcesses: 0
  # When a worker crash-loop persists (default: 5 crashes/30s, unbroken for 5 min),
  # exit the master with code 1 so the orchestrator (Dokku) marks the app down.
  # Default false: the master keeps self-healing (bounded backoff + noticeError).
  # Opt in per bridge (e.g. bridge-mira) for hard-fail monitoring.
  exitOnCrashLoop: false

# Logging
logs:
  console:
    active: true
    level: info
    format:
      color: true
      time: true
      aligned: true
  file:
    active: true
    path: application.log

# Storage
storage:
  files:
    directory: ./storage
